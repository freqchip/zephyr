description: Freqchip GPIO Controller

compatible: "freqchip,freqchip-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  clocks:
    required: false

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
